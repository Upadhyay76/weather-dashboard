<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Mumbai)" />
            <button onclick="getWeather()">Search</button>
        </div>

        <!-- Quick city buttons -->
        <div class="quick-cities">
            <button class="city-btn" onclick="quickSearch('Mumbai')">Mumbai</button>
            <button class="city-btn" onclick="quickSearch('Delhi')">Delhi</button>
            <button class="city-btn" onclick="quickSearch('Agra')">Agra</button>
            <button class="city-btn" onclick="quickSearch('Bangalore')">Bangalore</button>
        </div>

        <!-- Loading spinner -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
        </div>

        <!-- Current Weather Card -->
        <div id="weatherResult" class="weather-card hidden">
            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div>
                    <h2 id="cityName">City Name</h2>
                    <p id="description" class="description">Description</p>
                </div>
            </div>
            <p id="temp" class="temperature">0°C</p>
            <div class="details">
                <div class="detail-item">
                    <span class="detail-label">Humidity</span>
                    <span id="humidity" class="detail-value">0%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Wind</span>
                    <span id="wind" class="detail-value">0 m/s</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Feels Like</span>
                    <span id="feelsLike" class="detail-value">0°C</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Pressure</span>
                    <span id="pressure" class="detail-value">0 hPa</span>
                </div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastSection" class="hidden">
            <h3 class="forecast-title">5-Day Forecast</h3>
            <div id="forecastCards" class="forecast-row"></div>
        </div>

        <p id="error" class="error hidden"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
